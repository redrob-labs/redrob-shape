[package]
name = "redrob-shape"
description = "Redrob Shape: an agentic 3D creation suite, written from scratch in Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
default-run = "redrob-shape"

[[bin]]
name = "redrob-shape"
path = "src/main.rs"

[dependencies]
shape-ui-egui.workspace = true
eframe = { workspace = true, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui.workspace = true
shape-math.workspace = true
shape-scene.workspace = true
shape-agent.workspace = true
serde_json.workspace = true
env_logger.workspace = true
log.workspace = true
redrob-app-bridge = { git = "https://github.com/redrob-labs/redrob-code", tag = "v0.7.0" }
# The command line (src/cli.rs): read and write scene files.
shape-format.workspace = true

# The command line attaches to the console it was started from (src/cli.rs).
[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.29", default-features = false, features = ["kernel"] }

[dev-dependencies]
egui_kittest.workspace = true

[lints]
workspace = true
