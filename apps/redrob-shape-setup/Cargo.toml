[package]
name = "redrob-shape-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Branded Windows setup and uninstaller for Redrob Shape"

[[bin]]
name = "redrob-shape-setup"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Com",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Win32 FFI needs `unsafe`; this crate does not inherit the workspace's `unsafe_code = "forbid"`.
[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
