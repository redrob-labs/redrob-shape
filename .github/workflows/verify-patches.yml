name: verify patches

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Patches apply to pinned upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Verify the customization against the pinned upstream
        run: ./scripts/verify-patches.sh

  addon-tests:
    name: Add-on unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Setup Python
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: false

      # The add-on's tests that do not need a Blender runtime. They live in the overlay, so they
      # run without fetching upstream at all -- the previous shape of this repository had these
      # tests and no GitHub workflow to execute them.
      - name: Run the tests that do not need Blender
        run: |
          set -euo pipefail
          cd overlay/scripts/addons_core/redrob_shape
          python3 -m unittest discover -s tests -p 'test_*.py' -v
