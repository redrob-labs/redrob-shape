# Release pipeline: a `vX.Y.Z` tag builds an installer for every platform, publishes them to
# cdn.redrob.ai/shape/, then publishes the GitHub Release "Redrob Shape vX.Y.Z" through the
# organization's shared publish job (SHA256SUMS.txt, redrob-launcher.json, published as latest).
# A manual dispatch is a dry run: it builds and signs every job and publishes nothing.
#
# The tag must equal the workspace version in Cargo.toml; the version job fails otherwise, and
# every other job checks out the exact commit it resolved, so a push between dispatch and tag
# cannot split the binaries from the tag.
#
# Signing is the organization's: Windows through Azure Artifact Signing over OIDC, macOS with the
# Developer ID certificate and notarized through the App Store Connect API key. Every secret is
# optional: without them the build ships unsigned (Windows) or ad-hoc signed and not notarized
# (macOS), with a warning in the log.
#
# Asset names follow `redrob-shape-<version>-<os>-<arch>[-portable].<ext>`, the one shape Redrob
# Launcher installs (scripts/check-asset-names.py refuses anything else before it is published).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a run mid-notarization or mid-upload; a newer push waits its turn.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Resolve version
        run: |
          v="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-rc.1"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version $v"; exit 1
          fi
          { echo "version=$v"; echo "sha=$GITHUB_SHA"; } >>"$GITHUB_OUTPUT"
          echo "### Redrob Shape v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"
      - name: The asset-name gate tests itself
        run: python3 scripts/check-asset-names.py --self-test

  linux:
    name: Linux x86_64
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Build
        run: cargo build --release -p redrob-shape --target x86_64-unknown-linux-gnu
      - name: Package
        run: packaging/linux/package.sh x86_64-unknown-linux-gnu "${{ needs.version.outputs.version }}"
      - name: Named the way the launcher reads it
        run: python3 scripts/check-asset-names.py --version "${{ needs.version.outputs.version }}" dist/release/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: version
    runs-on: macos-latest
    # `release` is the environment whose protection rules guard the signing secrets.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos
      - name: Build both architectures
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release -p redrob-shape --target aarch64-apple-darwin
          cargo build --release -p redrob-shape --target x86_64-apple-darwin
      # After the build: the certificate sits in a temporary keychain only as long as it is needed.
      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Bundle, sign, notarize, disk image
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: packaging/macos/bundle.sh "${{ needs.version.outputs.version }}"
      - name: Named the way the launcher reads it
        run: python3 scripts/check-asset-names.py --version "${{ needs.version.outputs.version }}" dist/release/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error
      - name: Remove the temporary keychain
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    # `release` is the environment the organization's federated credential names.
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-${{ matrix.arch }}
      - name: Build
        run: cargo build --release -p redrob-shape --target ${{ matrix.target }}
      # The login comes AFTER the build: GitHub's OIDC token lives minutes.
      - name: Log in to Azure (OIDC)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign and package
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_CERT_PROFILE: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }} -Target ${{ matrix.target }} -Version "${{ needs.version.outputs.version }}"
      - name: Named the way the launcher reads it
        shell: bash
        run: python3 scripts/check-asset-names.py --version "${{ needs.version.outputs.version }}" dist/release/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  cdn:
    name: Publish to cdn.redrob.ai/shape
    needs: [version, linux, macos, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      REDROB_CDN_BUCKET: ${{ vars.REDROB_CDN_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      CDN_PUBLIC_HOST: cdn.redrob.ai
      CDN_PREFIX: shape
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: staging
          merge-multiple: true
      - name: What is about to be published, named the way the launcher reads it
        run: |
          set -euo pipefail
          test -n "$(ls -A staging 2>/dev/null)" || { echo "::error::nothing to publish"; exit 1; }
          for f in staging/*; do
            printf '%s  %s bytes  sha256 %s\n' "$(basename "$f")" "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
          done
          python3 scripts/check-asset-names.py --version "$APP_VERSION" staging/*
      # Versioned path first, read back and compared, and only then the latest/ alias. Without the
      # bucket variable and credentials the script says so and uploads nothing.
      - name: Publish to cdn.redrob.ai/shape
        run: bash .github/scripts/cdn-publish.sh staging

  publish:
    # The organization's one publish job: every `release-*` artifact, SHA256SUMS.txt,
    # redrob-launcher.json (Redrob Shape signs in through the shared engine, which reads the
    # launcher's shared account), and the release published as latest. Last, after the CDN: once
    # this runs the artifacts are public.
    name: Publish GitHub Release
    needs: [version, cdn]
    if: github.ref_type == 'tag'
    uses: redrob-labs/.github/.github/workflows/release-publish.yml@main
    permissions:
      contents: write
    with:
      version: ${{ needs.version.outputs.version }}
      title: Redrob Shape
      target: ${{ needs.version.outputs.sha }}
      launcher_manifest: true
      publish: true
