# The gate every pull request into develop and main must pass: the workspace compiles once
# (clippy, warnings as errors, no test targets). A by-hand run adds format, clippy on every
# target and the workspace tests. The job keeps its "fmt, clippy, test" name: it is required.
#
# It runs on pull requests only: a push to develop or main is the merge of a pull request that
# already passed it, and the release binary is built by release.yml on the tag. A pull request
# that only touches docs or only bumps version strings skips the heavy job (`changes` decides);
# a skipped job still satisfies the required "fmt, clippy, test" check.
name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull_request checkout is the merge commit; its first parent is the base tip, so
          # HEAD^1..HEAD is exactly this PR's change. Depth 2 avoids fetching the full history.
          fetch-depth: 2
      - name: Docs-only or version-only?
        id: diff
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo "heavy=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          BASE=$(git rev-parse HEAD^1)
          heavy=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*|LICENSE*|CHANGELOG*|VERSION|REDROB_VERSION|*-version.txt) continue ;;
              Cargo.toml|*/Cargo.toml|Cargo.lock|package.json|*/package.json|package-lock.json|pnpm-lock.yaml|yarn.lock)
                # Only version lines may change in these files.
                other=$(git diff -U0 "$BASE" HEAD -- "$f" \
                  | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' \
                  | grep -vE '^[+-][[:space:]]*(version = "[^"]*"|"version": "[^"]*",?)[[:space:]]*$' || true)
                if [ -n "$other" ]; then heavy=true; echo "non-version change in $f"; fi ;;
              *) heavy=true; echo "code change: $f" ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          echo "heavy=$heavy" | tee -a "$GITHUB_OUTPUT"

  check:
    name: fmt, clippy, test
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the desktop app
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      # A pull request compiles the code once: clippy without test targets. Formatting, lint of
      # test code and the test suite run on a by-hand (workflow_dispatch) run only; the release
      # build compiles again on every target.
      - name: cargo fmt (manual runs only)
        if: github.event_name != 'pull_request'
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --locked -- -D warnings
      - name: cargo clippy --all-targets (manual runs only)
        if: github.event_name != 'pull_request'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test (manual runs only)
        if: github.event_name != 'pull_request'
        run: cargo test --workspace
      - name: cargo build (release binary links, manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: cargo build --release -p redrob-shape
