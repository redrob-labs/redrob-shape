# Sign artefacts built somewhere else, then publish them. The same split as redrob-browser's
# sign-and-publish.yml, and for the same reasons.
#
# The unsigned artefacts arrive on a DRAFT GitHub Release:
#   redrob-shape-macos-arm64-unsigned.zip    from macos.yml (ditto, Redrob Shape.app at the top)
#   redrob-shape-windows-x64-unsigned.zip    from windows.yml (the installed tree at the top)
#   redrob-shape-linux-x64-<version>.tar.xz  from a Linux build host (nothing to sign)
# Nobody sees them there. This workflow signs each one, verifies every signature, replaces the
# assets with the signed ones, publishes to cdn.redrob.ai/shape/, and only then undrafts.
#
#   local:  gh release create v0.1.0 --draft <the three artefacts>
#   here:   workflow_dispatch with tag=v0.1.0
#
# WHAT A SIGNATURE HERE MEANS. It attests that the holder of the certificate approved these bytes.
# It does NOT attest that the bytes came from this tree: the build ran on another machine.
name: sign-and-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag carrying the unsigned artefacts (e.g. v0.1.0)"
        required: true
      undraft:
        description: "Publish the release once signing verifies"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  probe:
    name: what is on this release
    # On ubuntu: deciding whether a mac artefact exists must not itself start a macOS runner.
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.assets.outputs.mac }}
      win: ${{ steps.assets.outputs.win }}
      version: ${{ steps.assets.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - id: assets
        run: |
          set -euo pipefail
          version="$(cat REDROB_VERSION)"
          if [ "${{ inputs.tag }}" != "v$version" ]; then
            echo "::error::tag ${{ inputs.tag }} does not match REDROB_VERSION $version"
            exit 1
          fi
          names="$(gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --json assets -q '.assets[].name')"
          echo "assets on ${{ inputs.tag }}:"
          printf '  %s\n' $names
          has() { printf '%s\n' $names | grep -qE "$1" && echo true || echo false; }
          {
            echo "mac=$(has 'macos-arm64-unsigned\.zip$')"
            echo "win=$(has 'windows-x64-unsigned\.zip$')"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  sign-macos:
    name: sign and notarize the macOS app
    needs: probe
    if: needs.probe.outputs.mac == 'true'
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
      VERSION: ${{ needs.probe.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: require the Apple signing and notarization secrets
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_NOTARY_API_KEY_P8_BASE64 \
            APPLE_API_KEY APPLE_API_ISSUER; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing macOS signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | openssl base64 -d -A > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: download and unpack the app
        run: |
          set -euo pipefail
          mkdir -p incoming unpacked
          gh release download "${{ inputs.tag }}" -p '*macos-arm64-unsigned.zip' -D incoming
          # ditto both ways: a plain zip loses the bundle's symlinks and the seal then fails.
          ditto -x -k incoming/*.zip unpacked
          app="$(find unpacked -maxdepth 2 -type d -name '*.app' | head -1)"
          test -n "$app" || { echo "::error::no .app in the archive"; ls -R unpacked | head -40; exit 1; }
          echo "APP_PATH=$app" >> "$GITHUB_ENV"
          echo "app: $app"

      - name: stamp our version into the bundle
        # Before signing: Info.plist is sealed by the signature. Blender's own 5.3.0 stays in the
        # About box as the engine version; the bundle carries the product's.
        run: |
          set -euo pipefail
          plist="$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$plist"

      - name: import the signing certificate into a throwaway keychain
        # set-key-partition-list is the step people leave out: without it codesign prompts, and a
        # prompt on a runner is a hang.
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/redrob-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          p12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$p12"
          security import "$p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -nE 's/.*"(Developer ID Application: .*)"/\1/p' | head -1)"
          test -n "$identity" || { echo "::error::no Developer ID Application identity"; exit 1; }
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "identity: $identity"

      - name: sign inside-out
        # Every Mach-O first (Python's .so modules, the dylibs, the agent), then the thumbnailer
        # extension, then the app. The hardened runtime everywhere, because notarization rejects any
        # Mach-O without it. The app and the agent get Blender's own entitlements
        # (release/darwin/entitlements.plist): Python's ctypes, unsigned add-on dylibs and LLVM's JIT
        # need them, and without them Blender starts and then dies on the first Python import.
        run: |
          set -euo pipefail
          # Copied verbatim from upstream's release/darwin/ at the pinned commit (scripts/macos/).
          ents="scripts/macos/entitlements.plist"
          thumb_ents="scripts/macos/thumbnailer_entitlements.plist"
          plutil -lint "$ents" "$thumb_ents"
          sign() { codesign --sign "$SIGNING_IDENTITY" --force --timestamp --options runtime \
            --keychain "$SIGNING_KEYCHAIN" "$@"; }
          main_exe="$APP_PATH/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          count=0
          while IFS= read -r -d '' f; do
            [ "$f" = "$main_exe" ] && continue
            case "$f" in *.appex/*) continue ;; esac
            # Executables, dylibs and Python's .so bundles; never object files or static archives,
            # which codesign refuses.
            file -b "$f" | grep -qE '^Mach-O.*(executable|shared library|bundle)' || continue
            if [ "$(basename "$f")" = "redrob-shape-agent" ]; then
              sign --entitlements "$ents" "$f"
            else
              sign "$f"
            fi
            count=$((count + 1))
          done < <(find "$APP_PATH/Contents" -type f -print0)
          echo "signed $count nested Mach-O files"
          for appex in "$APP_PATH"/Contents/PlugIns/*.appex; do
            [ -d "$appex" ] || continue
            sign --entitlements "$thumb_ents" "$appex"
          done
          sign --entitlements "$ents" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: notarize and staple
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "$APP_PATH" notarize.zip
          set +e
          xcrun notarytool submit notarize.zip \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 90m --output-format json > notarize.json
          rc=$?
          set -e
          cat notarize.json
          id="$(python3 -c 'import json; print(json.load(open("notarize.json")).get("id",""))')"
          status="$(python3 -c 'import json; print(json.load(open("notarize.json")).get("status",""))')"
          if [ "$rc" -ne 0 ] || [ "$status" != "Accepted" ]; then
            echo "::error::notarization ended with status '$status' (rc=$rc)"
            [ -n "$id" ] && xcrun notarytool log "$id" \
              --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" || true
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"

      - name: verify the signature, the ticket and Gatekeeper
        # Three checks: signed, ticket attached, and this machine would run it.
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          mkdir -p staging
          ditto -c -k --keepParent "$APP_PATH" "staging/redrob-shape-macos-arm64-$VERSION.zip"

      - name: clean up the keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-macos
          path: staging/*.zip
          if-no-files-found: error

  sign-windows:
    name: sign the Windows build
    needs: probe
    if: needs.probe.outputs.win == 'true'
    runs-on: windows-2025
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WIN_CSC_LINK }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      VERSION: ${{ needs.probe.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: require the Windows signing certificate
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing Windows signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: download and unpack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path incoming | Out-Null
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p "*windows-x64-unsigned.zip" -D incoming
          if ($LASTEXITCODE -ne 0) { throw "download failed" }
          $zip = Get-ChildItem incoming -Filter "*.zip" | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath "app\Redrob Shape"
          Get-ChildItem "app\Redrob Shape" -Filter *.exe | ForEach-Object { Write-Host $_.Name }

      - name: import the signing certificate
        id: certificate
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "redrob-code-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          if (-not $imported.Thumbprint) { throw "The certificate imported without a thumbprint" }
          Write-Host "Imported $($imported.Subject)"
          "thumbprint=$($imported.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: sign the executables
        # The programs a user or Windows itself launches: blender.exe, the console launcher and the
        # agent. RFC 3161 timestamps, so the signature outlives the certificate.
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found in the Windows SDK" }
          $exes = Get-ChildItem "app\Redrob Shape" -Filter *.exe
          if ($exes.Count -lt 2) { throw "expected blender.exe and the agent, found $($exes.Count) executables" }
          foreach ($exe in $exes) {
            & $signtool.FullName sign /sha1 "${{ steps.certificate.outputs.thumbprint }}" `
              /fd sha256 /td sha256 /tr "http://timestamp.digicert.com" $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $($exe.Name) with $LASTEXITCODE" }
          }

      - name: verify the Authenticode signatures
        # This organisation's certificate is not trusted on a fresh runner, so Status reads
        # UnknownError or NotTrusted rather than Valid. Only an unsigned file or a broken hash fails.
        shell: pwsh
        run: |
          $accepted = @("Valid", "UnknownError", "NotTrusted")
          foreach ($exe in Get-ChildItem "app\Redrob Shape" -Filter *.exe) {
            $s = Get-AuthenticodeSignature $exe.FullName
            if (-not $s.SignerCertificate) { throw "$($exe.Name) has no signer certificate" }
            if ($accepted -notcontains $s.Status.ToString()) { throw "$($exe.Name): $($s.Status) $($s.StatusMessage)" }
            if (-not $s.TimeStamperCertificate) { throw "$($exe.Name) carries no timestamp" }
            Write-Host "$($exe.Name): $($s.SignerCertificate.Subject) status=$($s.Status)"
          }
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Compress-Archive -Path "app\Redrob Shape" -DestinationPath "staging\redrob-shape-windows-x64-$env:VERSION.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-windows
          path: staging/*.zip
          if-no-files-found: error

  publish:
    name: replace the assets, publish to the CDN, undraft
    needs: [probe, sign-macos, sign-windows]
    # Skipped is not failed: a release without a Windows build still publishes. A build that was
    # meant to be signed and could not be never reaches the CDN.
    if: ${{ !cancelled() && needs.probe.result == 'success' && needs.sign-macos.result != 'failure' && needs.sign-windows.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.probe.outputs.version }}
      REDROB_CDN_BUCKET: ${{ vars.REDROB_CDN_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      CDN_PUBLIC_HOST: cdn.redrob.ai
      CDN_PREFIX: shape
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: collect the Linux build as built
        # Nothing to sign: a tarball is not signed in this ecosystem.
        run: |
          set -euo pipefail
          mkdir -p staging
          gh release download "${{ inputs.tag }}" -p "*linux-x64-$VERSION.tar.xz" -D staging || \
            echo "::notice::no Linux build on this release"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: signed-macos
          path: staging

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: signed-windows
          path: staging

      - name: what is about to be published
        run: |
          set -euo pipefail
          test -n "$(ls -A staging 2>/dev/null)" || { echo "::error::nothing to publish"; exit 1; }
          for f in staging/*; do
            printf '%s  %s bytes  sha256 %s\n' "$(basename "$f")" "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
          done

      - name: put the signed assets on the release, one by one
        # One upload per file with retries: a single 5xx must not cost a notarized build. The unsigned
        # uploads are deleted afterwards, so the published release carries only signed bytes.
        run: |
          set -euo pipefail
          up() {
            for attempt in 1 2 3 4 5; do
              gh release upload "${{ inputs.tag }}" "$1" --clobber && return 0
              echo "upload of $(basename "$1") failed (attempt $attempt), retrying"; sleep $((attempt * 15))
            done
            return 1
          }
          ( cd staging && for f in *; do sha256sum "$f" > "$f.sha256"; done )
          for f in staging/*; do up "$f"; done
          for pattern in macos-arm64-unsigned.zip windows-x64-unsigned.zip; do
            name="$(gh release view "${{ inputs.tag }}" --json assets -q ".assets[].name | select(endswith(\"$pattern\"))")"
            [ -n "$name" ] && gh release delete-asset "${{ inputs.tag }}" "$name" --yes
          done
          gh release view "${{ inputs.tag }}" --json assets -q '.assets[].name'

      - name: publish to cdn.redrob.ai/shape
        # Versioned path first, read back and compared, and only then the latest/ alias.
        env:
          APP_VERSION: ${{ needs.probe.outputs.version }}
        run: |
          set -euo pipefail
          rm -f staging/*.sha256
          bash .github/scripts/cdn-publish.sh staging

      - name: undraft the release
        # Last: once this runs the artefacts are public.
        if: ${{ inputs.undraft }}
        run: |
          set -euo pipefail
          gh release edit "${{ inputs.tag }}" --draft=false
          gh release view "${{ inputs.tag }}" --json isDraft,url -q '"draft=" + (.isDraft|tostring) + "  " + .url'
