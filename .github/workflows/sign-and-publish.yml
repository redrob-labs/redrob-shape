# Sign artefacts built somewhere else, then publish them. The same split as redrob-browser's
# sign-and-publish.yml, and for the same reasons.
#
# The unsigned artefacts arrive on a DRAFT GitHub Release:
#   redrob-shape-macos-arm64-unsigned.zip            from macos.yml (ditto, Redrob Shape.app at the top)
#   redrob-shape-windows-x64-unsigned.zip            from windows.yml (the installed tree at the top)
#   redrob-shape-<version>-linux-x86_64.tar.gz       from a Linux build host (scripts/package-linux.sh;
#                                                    nothing to sign)
# Nobody sees them there. This workflow signs each one, verifies every signature, replaces the
# assets with the signed ones, publishes to cdn.redrob.ai/shape/, and only then undrafts.
#
# What it publishes is named the way Redrob Launcher reads a release
# (redrob-shape-<version>-<os>-<arch>[-portable].<ext>; scripts/check-asset-names.py is the gate):
#   redrob-shape-<version>-macos-aarch64.dmg          signed, notarized, stapled app in a disk image
#   redrob-shape-<version>-windows-x64-portable.zip   the installed tree, executables Authenticode-signed
#   redrob-shape-<version>-linux-x86_64.tar.gz        as built
#   redrob-launcher.json                              the launcher's release manifest: this release
#                                                     reads the launcher's shared account
#   SHA256SUMS.txt and one .sha256 per file
#
# The whole release, in order (AGENTS.md has the branch model):
#   1. release/<version> from develop: REDROB_VERSION = <version>; pull request into main; merge.
#   2. workflow_dispatch macos.yml and windows.yml on main; download the two unsigned zips.
#   3. On a Linux build host: the gate's tree, build, then scripts/package-linux.sh <install-dir>.
#   4. git tag -a v<version> <main sha>; push only that tag.
#   5. gh release create v<version> --draft --title "Redrob Shape <version>" <the three artefacts>
#   6. workflow_dispatch here with tag=v<version>; it undrafts when every signature verifies.
#   7. Back-merge main into develop by pull request (sync/<version>).
#
# WHAT A SIGNATURE HERE MEANS. It attests that the holder of the certificate approved these bytes.
# It does NOT attest that the bytes came from this tree: the build ran on another machine.
name: sign-and-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag carrying the unsigned artefacts (e.g. v0.1.0)"
        required: true
      undraft:
        description: "Publish the release once signing verifies"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  probe:
    name: what is on this release
    # On ubuntu: deciding whether a mac artefact exists must not itself start a macOS runner.
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.assets.outputs.mac }}
      win: ${{ steps.assets.outputs.win }}
      version: ${{ steps.assets.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - id: assets
        run: |
          set -euo pipefail
          version="$(cat REDROB_VERSION)"
          if [ "${{ inputs.tag }}" != "v$version" ]; then
            echo "::error::tag ${{ inputs.tag }} does not match REDROB_VERSION $version"
            exit 1
          fi
          names="$(gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --json assets -q '.assets[].name')"
          echo "assets on ${{ inputs.tag }}:"
          printf '  %s\n' $names
          has() { printf '%s\n' $names | grep -qE "$1" && echo true || echo false; }
          {
            echo "mac=$(has 'macos-arm64-unsigned\.zip$')"
            echo "win=$(has 'windows-x64-unsigned\.zip$')"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  sign-macos:
    name: sign and notarize the macOS app
    needs: probe
    if: needs.probe.outputs.mac == 'true'
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
      VERSION: ${{ needs.probe.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: require the Apple signing and notarization secrets
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_NOTARY_API_KEY_P8_BASE64 \
            APPLE_API_KEY APPLE_API_ISSUER; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing macOS signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | openssl base64 -d -A > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: download and unpack the app
        run: |
          set -euo pipefail
          mkdir -p incoming unpacked
          gh release download "${{ inputs.tag }}" -p '*macos-arm64-unsigned.zip' -D incoming
          # ditto both ways: a plain zip loses the bundle's symlinks and the seal then fails.
          ditto -x -k incoming/*.zip unpacked
          app="$(find unpacked -maxdepth 2 -type d -name '*.app' | head -1)"
          test -n "$app" || { echo "::error::no .app in the archive"; ls -R unpacked | head -40; exit 1; }
          echo "APP_PATH=$app" >> "$GITHUB_ENV"
          echo "app: $app"

      - name: stamp our version into the bundle
        # Before signing: Info.plist is sealed by the signature. Blender's own 5.3.0 stays in the
        # About box as the engine version; the bundle carries the product's.
        run: |
          set -euo pipefail
          plist="$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$plist"

      - name: import the signing certificate into a throwaway keychain
        # set-key-partition-list is the step people leave out: without it codesign prompts, and a
        # prompt on a runner is a hang.
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/redrob-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          p12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$p12"
          security import "$p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -nE 's/.*"(Developer ID Application: .*)"/\1/p' | head -1)"
          test -n "$identity" || { echo "::error::no Developer ID Application identity"; exit 1; }
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "identity: $identity"

      - name: sign inside-out
        # Every Mach-O first (Python's .so modules, the dylibs, the agent), then the thumbnailer
        # extension, then the app. The hardened runtime everywhere, because notarization rejects any
        # Mach-O without it. The app and the agent get Blender's own entitlements
        # (release/darwin/entitlements.plist): Python's ctypes, unsigned add-on dylibs and LLVM's JIT
        # need them, and without them Blender starts and then dies on the first Python import.
        run: |
          set -euo pipefail
          # Copied verbatim from upstream's release/darwin/ at the pinned commit (scripts/macos/).
          ents="scripts/macos/entitlements.plist"
          thumb_ents="scripts/macos/thumbnailer_entitlements.plist"
          plutil -lint "$ents" "$thumb_ents"
          sign() { codesign --sign "$SIGNING_IDENTITY" --force --timestamp --options runtime \
            --keychain "$SIGNING_KEYCHAIN" "$@"; }
          main_exe="$APP_PATH/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          count=0
          while IFS= read -r -d '' f; do
            [ "$f" = "$main_exe" ] && continue
            case "$f" in *.appex/*) continue ;; esac
            # Executables, dylibs and Python's .so bundles; never object files or static archives,
            # which codesign refuses.
            file -b "$f" | grep -qE '^Mach-O.*(executable|shared library|bundle)' || continue
            if [ "$(basename "$f")" = "redrob-shape-agent" ]; then
              sign --entitlements "$ents" "$f"
            else
              sign "$f"
            fi
            count=$((count + 1))
          done < <(find "$APP_PATH/Contents" -type f -print0)
          echo "signed $count nested Mach-O files"
          for appex in "$APP_PATH"/Contents/PlugIns/*.appex; do
            [ -d "$appex" ] || continue
            sign --entitlements "$thumb_ents" "$appex"
          done
          sign --entitlements "$ents" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: notarize and staple
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "$APP_PATH" notarize.zip
          set +e
          xcrun notarytool submit notarize.zip \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 90m --output-format json > notarize.json
          rc=$?
          set -e
          cat notarize.json
          id="$(python3 -c 'import json; print(json.load(open("notarize.json")).get("id",""))')"
          status="$(python3 -c 'import json; print(json.load(open("notarize.json")).get("status",""))')"
          if [ "$rc" -ne 0 ] || [ "$status" != "Accepted" ]; then
            echo "::error::notarization ended with status '$status' (rc=$rc)"
            [ -n "$id" ] && xcrun notarytool log "$id" \
              --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" || true
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"

      - name: verify the signature, the ticket and Gatekeeper
        # Three checks: signed, ticket attached, and this machine would run it.
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: disk image
        # Redrob Launcher installs a macOS app from a .dmg only (it attaches the image and copies
        # "Redrob Shape.app" from its root), and a person drags it to the Applications link beside
        # it. The image is signed and notarized in its own right, then stapled, so Gatekeeper
        # passes it offline as well.
        run: |
          set -euo pipefail
          mkdir -p dmgroot staging
          ditto "$APP_PATH" "dmgroot/$(basename "$APP_PATH")"
          ln -s /Applications dmgroot/Applications
          dmg="staging/redrob-shape-$VERSION-macos-aarch64.dmg"
          hdiutil create -volname "Redrob Shape $VERSION" -srcfolder dmgroot -fs HFS+ -format UDZO -ov "$dmg"
          codesign --sign "$SIGNING_IDENTITY" --force --timestamp --keychain "$SIGNING_KEYCHAIN" "$dmg"
          set +e
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 90m --output-format json > notarize-dmg.json
          rc=$?
          set -e
          cat notarize-dmg.json
          id="$(python3 -c 'import json; print(json.load(open("notarize-dmg.json")).get("id",""))')"
          status="$(python3 -c 'import json; print(json.load(open("notarize-dmg.json")).get("status",""))')"
          if [ "$rc" -ne 0 ] || [ "$status" != "Accepted" ]; then
            echo "::error::disk image notarization ended with status '$status' (rc=$rc)"
            [ -n "$id" ] && xcrun notarytool log "$id" \
              --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" || true
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          python3 scripts/check-asset-names.py --version "$VERSION" "$dmg"

      - name: clean up the keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-macos
          path: staging/*.dmg
          if-no-files-found: error

  sign-windows:
    name: sign the Windows build
    needs: probe
    if: needs.probe.outputs.win == 'true'
    runs-on: windows-2025
    # `release` is the environment the organization's federated credential names
    # (repo:redrob-labs@<org id>/<repo>@<id>:environment:release); any other name is refused.
    environment: release
    permissions:
      contents: read
      # The OIDC token `azure/login` exchanges for the Artifact Signing credential.
      id-token: write
    env:
      # Plain IDs (not credentials). AZURE_CLIENT_ID is in the job env so the login step can be
      # skipped when signing is not set up; the require step below turns that into a failure here,
      # because a Windows build that cannot be signed must never reach the CDN.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      # sign-and-publish signs through Azure Artifact Signing (sign step below). These name the
      # signing account; the credential comes from the OIDC login, so nothing here is secret
      # material and no certificate file or client secret exists anywhere.
      ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_CERT_PROFILE: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}
      VERSION: ${{ needs.probe.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: require the Artifact Signing configuration
        # Six redrob-labs organization secrets, all plain IDs. Do not recreate them as repository
        # secrets: a same-named repository secret overrides the organization one.
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            ARTIFACT_SIGNING_ENDPOINT ARTIFACT_SIGNING_ACCOUNT ARTIFACT_SIGNING_CERT_PROFILE; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing Windows signing configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: download and unpack
        # Before the Azure login: the build is large and GitHub's OIDC token lives minutes.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path incoming | Out-Null
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p "*windows-x64-unsigned.zip" -D incoming
          if ($LASTEXITCODE -ne 0) { throw "download failed" }
          $zip = Get-ChildItem incoming -Filter "*.zip" | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath "app\Redrob Shape"
          Get-ChildItem "app\Redrob Shape" -Filter *.exe | ForEach-Object { Write-Host $_.Name }

      - name: the Artifact Signing client and signtool
        # Also before the login, for the same reason. The signtool dlib comes from the
        # Microsoft.ArtifactSigning.Client NuGet package; it authenticates with DefaultAzureCredential,
        # so the `az login` below is what it uses.
        id: tools
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found in the Windows SDK" }
          $client = Join-Path $env:RUNNER_TEMP "artifact-signing-client"
          New-Item -ItemType Directory -Force -Path $client | Out-Null
          $pkg = Join-Path $client "artifact-signing-client.zip"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client" -OutFile $pkg
          Expand-Archive -Path $pkg -DestinationPath (Join-Path $client "client") -Force
          $dlib = Get-ChildItem -Path (Join-Path $client "client") -Recurse -Filter Azure.CodeSigning.Dlib.dll |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $dlib) { throw "Azure.CodeSigning.Dlib.dll not found in Microsoft.ArtifactSigning.Client" }
          $metadata = Join-Path $client "metadata.json"
          @{
            Endpoint               = $env:ARTIFACT_SIGNING_ENDPOINT.TrimEnd('/')
            CodeSigningAccountName = $env:ARTIFACT_SIGNING_ACCOUNT
            CertificateProfileName = $env:ARTIFACT_SIGNING_CERT_PROFILE
            # Only the credentials a CI runner or a developer shell can satisfy. Without this list a
            # missing login falls through to InteractiveBrowserCredential, which opens a browser nobody
            # sees and waits forever (one release elsewhere hung 30 minutes on it). Now it fails in seconds.
            ExcludeCredentials     = @(
              'InteractiveBrowserCredential', 'ManagedIdentityCredential', 'SharedTokenCacheCredential',
              'VisualStudioCredential', 'VisualStudioCodeCredential', 'AzurePowerShellCredential',
              'AzureDeveloperCliCredential', 'WorkloadIdentityCredential'
            )
          } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8
          "signtool=$($signtool.FullName)" >> $env:GITHUB_OUTPUT
          "dlib=$($dlib.FullName)" >> $env:GITHUB_OUTPUT
          "metadata=$metadata" >> $env:GITHUB_OUTPUT

      # Azure Artifact Signing, authenticated with OpenID Connect: the job's GitHub token is exchanged
      # for an Azure token against the organization's app registration, whose federated credential
      # accepts `repo:redrob-labs@<org id>/*:environment:release`. No client secret exists anywhere.
      # Immediately before signing and after every download, because the OIDC token lives minutes.
      - name: Log in to Azure (OIDC)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: sign the executables
        # The programs a user or Windows itself launches: blender.exe, the console launcher and the
        # agent. RFC 3161 timestamps from the Artifact Signing service, so the signature outlives the
        # certificate.
        shell: pwsh
        run: |
          $exes = Get-ChildItem "app\Redrob Shape" -Filter *.exe
          if ($exes.Count -lt 2) { throw "expected blender.exe and the agent, found $($exes.Count) executables" }
          Write-Host "Signing with Azure Artifact Signing ($env:ARTIFACT_SIGNING_ACCOUNT / $env:ARTIFACT_SIGNING_CERT_PROFILE)"
          foreach ($exe in $exes) {
            & "${{ steps.tools.outputs.signtool }}" sign /v /fd SHA256 /td SHA256 `
              /d "Redrob Shape" /du "https://github.com/redrob-labs/redrob-shape" `
              /tr "http://timestamp.acs.microsoft.com" `
              /dlib "${{ steps.tools.outputs.dlib }}" /dmdf "${{ steps.tools.outputs.metadata }}" $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $($exe.Name) with $LASTEXITCODE" }
          }

      - name: verify the Authenticode signatures
        # A Public Trust certificate chains to a Microsoft root every Windows trusts, so the full
        # Authenticode check must pass: signtool's own, then Status Valid and nothing less. The
        # signer must be the organization's certificate, so a profile pointed at the wrong
        # certificate never publishes.
        shell: pwsh
        run: |
          $expectedSigner = "CN=McKinley Rice, Inc."
          foreach ($exe in Get-ChildItem "app\Redrob Shape" -Filter *.exe) {
            & "${{ steps.tools.outputs.signtool }}" verify /pa /v $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed on $($exe.Name) with $LASTEXITCODE" }
            $s = Get-AuthenticodeSignature $exe.FullName
            if (-not $s.SignerCertificate) { throw "$($exe.Name) has no signer certificate" }
            if ($s.Status -ne 'Valid') { throw "$($exe.Name) signature status $($s.Status): $($s.StatusMessage)" }
            if (-not $s.TimeStamperCertificate) { throw "$($exe.Name) carries no timestamp" }
            if ($s.SignerCertificate.Subject -notlike "$expectedSigner*") {
              throw "$($exe.Name) is signed by '$($s.SignerCertificate.Subject)', expected '$expectedSigner'"
            }
            Write-Host "$($exe.FullName) signed by $($s.SignerCertificate.Subject)"
          }
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          # "-portable.zip": the one zip name Redrob Launcher reads as an installable Windows build.
          Compress-Archive -Path "app\Redrob Shape" -DestinationPath "staging\redrob-shape-$env:VERSION-windows-x64-portable.zip"
          python scripts/check-asset-names.py --version $env:VERSION (Get-ChildItem staging\*.zip).FullName
          if ($LASTEXITCODE -ne 0) { throw "the zip is not named the way the launcher reads it" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-windows
          path: staging/*.zip
          if-no-files-found: error

  publish:
    name: replace the assets, publish to the CDN, undraft
    needs: [probe, sign-macos, sign-windows]
    # Skipped is not failed: a release without a Windows build still publishes. A build that was
    # meant to be signed and could not be never reaches the CDN.
    if: ${{ !cancelled() && needs.probe.result == 'success' && needs.sign-macos.result != 'failure' && needs.sign-windows.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.probe.outputs.version }}
      REDROB_CDN_BUCKET: ${{ vars.REDROB_CDN_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      CDN_PUBLIC_HOST: cdn.redrob.ai
      CDN_PREFIX: shape
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: collect the Linux build as built
        # Nothing to sign: a tarball is not signed in this ecosystem.
        run: |
          set -euo pipefail
          mkdir -p staging
          gh release download "${{ inputs.tag }}" -p "redrob-shape-$VERSION-linux-x86_64.tar.gz" -D staging || \
            echo "::notice::no Linux build on this release"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: signed-macos
          path: staging

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: signed-windows
          path: staging

      - name: the release manifest Redrob Launcher reads
        # One small asset beside the installers (redrob-launcher, docs/release-manifest.md). From
        # it the launcher learns, without a launcher release, that this build reads its shared
        # account file: signing in to the launcher is all a person needs. Written here, in the one
        # job that assembles the whole release, so it goes into SHA256SUMS.txt with the rest.
        run: |
          set -euo pipefail
          test -n "$(ls -A staging 2>/dev/null)" || { echo "::error::nothing to publish"; exit 1; }
          printf '{ "schema": 1, "sharedAccount": true }\n' > staging/redrob-launcher.json
          cat staging/redrob-launcher.json

      - name: what is about to be published, named the way the launcher reads it
        # The gate for the names and for the manifest: a release whose assets Redrob Launcher
        # skips, or that lacks redrob-launcher.json, is not published.
        run: |
          set -euo pipefail
          for f in staging/*; do
            printf '%s  %s bytes  sha256 %s\n' "$(basename "$f")" "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
          done
          python3 scripts/check-asset-names.py --version "$VERSION" --release-dir staging

      - name: put the signed assets on the release, one by one
        # One upload per file with retries: a single 5xx must not cost a notarized build. The unsigned
        # uploads are deleted afterwards, so the published release carries only signed bytes.
        run: |
          set -euo pipefail
          up() {
            for attempt in 1 2 3 4 5; do
              gh release upload "${{ inputs.tag }}" "$1" --clobber && return 0
              echo "upload of $(basename "$1") failed (attempt $attempt), retrying"; sleep $((attempt * 15))
            done
            return 1
          }
          # SHA256SUMS.txt is what Redrob Launcher reads when it must not spend API quota on the
          # release (it lists redrob-launcher.json too, so that path sees the manifest); the
          # per-file sidecars are what the CDN page links.
          ( cd staging && sha256sum -- * > SHA256SUMS.txt && for f in *; do
              [ "$f" = SHA256SUMS.txt ] || sha256sum "$f" > "$f.sha256"; done )
          for f in staging/*; do up "$f"; done
          for pattern in macos-arm64-unsigned.zip windows-x64-unsigned.zip; do
            name="$(gh release view "${{ inputs.tag }}" --json assets -q ".assets[].name | select(endswith(\"$pattern\"))")"
            [ -n "$name" ] && gh release delete-asset "${{ inputs.tag }}" "$name" --yes
          done
          gh release view "${{ inputs.tag }}" --json assets -q '.assets[].name'

      - name: publish to cdn.redrob.ai/shape
        # Versioned path first, read back and compared, and only then the latest/ alias. The
        # manifest stays off the CDN: the launcher reads it from the GitHub Release only, and
        # cdn-publish.sh refuses a name without a -<version> segment.
        env:
          APP_VERSION: ${{ needs.probe.outputs.version }}
        run: |
          set -euo pipefail
          rm -f staging/*.sha256 staging/SHA256SUMS.txt staging/redrob-launcher.json
          bash .github/scripts/cdn-publish.sh staging

      - name: undraft the release
        # Last: once this runs the artefacts are public.
        if: ${{ inputs.undraft }}
        run: |
          set -euo pipefail
          gh release edit "${{ inputs.tag }}" --draft=false
          gh release view "${{ inputs.tag }}" --json isDraft,url -q '"draft=" + (.isDraft|tostring) + "  " + .url'
