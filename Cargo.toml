[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/redrob-labs/redrob-shape"

[workspace.dependencies]
# internal -- one crate per layer, see ROADMAP.md
shape-math = { path = "crates/math" }
shape-geom = { path = "crates/geom" }
shape-ops = { path = "crates/ops" }
shape-scene = { path = "crates/scene" }
shape-undo = { path = "crates/undo" }
shape-format = { path = "crates/format" }
shape-blend = { path = "crates/blend" }
shape-gpu = { path = "crates/gpu" }
shape-render = { path = "crates/render" }
shape-agent = { path = "crates/agent" }
shape-ui-egui = { path = "crates/ui-egui" }
shape-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
env_logger = "0.11"
rayon = "1"
glam = { version = "0.30", features = ["serde"] }

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui-wgpu = "0.36"
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu"] }
rfd = "0.17"
dirs = "6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
